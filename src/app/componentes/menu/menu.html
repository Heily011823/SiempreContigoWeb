<aside id="menu-lateral" class="sidebar" [class.abierto]="abierto()">
  <div class="logo">
    <h1>Siempre Contigo</h1>
    <div class="logo-circulo">
      <img src="images/Logo2.png" alt="Logo de Siempre Contigo" />
    </div>
  </div>

  <nav class="menu" aria-label="Menú principal">
    @for (opcion of opciones; track opcion.ruta) {
      <a
        class="menu-item"
        [routerLink]="opcion.ruta"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ exact: opcion.ruta === '/' }"
        (click)="cerrar.emit()"
      >
        <img [src]="opcion.icono" alt="" />
        <span>{{ opcion.texto }}</span>
      </a>
    }
  </nav>

  <button type="button" class="cerrar-sesion" (click)="salir()">
    <img src="images/cerrar-sesion.png" alt="" />
    <span>Cerrar Sesión</span>
  </button>
</aside>

@if (abierto()) {
  <div class="fondo" (click)="cerrar.emit()" aria-hidden="true"></div>
}
