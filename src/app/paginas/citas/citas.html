<h2 class="titulo-seccion">Mis citas</h2>
<p class="descripcion-seccion">Aquí puedes consultar todas tus citas médicas programadas.</p>

<section class="panel" aria-labelledby="titulo-citas">
  <h3 id="titulo-citas">Citas programadas</h3>
  <div class="tabla-contenedor">
    <table>
      <thead>
        <tr>
          <th scope="col">Médico</th>
          <th scope="col">Especialidad</th>
          <th scope="col">Fecha</th>
          <th scope="col">Hora</th>
          <th scope="col">Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (cita of datos.citas(); track cita.medico) {
          <tr>
            <td>{{ cita.medico }}</td>
            <td>{{ cita.especialidad }}</td>
            <td>{{ cita.fecha }}</td>
            <td>{{ cita.hora }}</td>
            <td>
              <span class="insignia" [class.proxima]="cita.estado === 'Próxima'" [class.realizada]="cita.estado === 'Realizada'">
                {{ cita.estado }}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
